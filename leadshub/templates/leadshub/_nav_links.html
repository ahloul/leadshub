{# djust:partial #}
{% comment %}One section's links in the sidebar (base.html). Expects "links".{% endcomment %}
<ul class="space-y-0.5">
    {% for link in links %}
    <li>
        <a href="{{ link.url }}"{% if link.live %} dj-navigate="{{ link.url }}"{% endif %}{% if link.current %} aria-current="page"{% endif %}
           class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 aria-[current=page]:bg-indigo-50 aria-[current=page]:text-indigo-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white dark:aria-[current=page]:bg-indigo-950 dark:aria-[current=page]:text-indigo-300"><svg class="h-5 w-5 shrink-0 fill-current" viewBox="{{ nav_icon_viewbox }}" aria-hidden="true"><path d="{{ link.icon }}"/></svg><span class="min-w-0 flex-1 truncate">{{ link.label }}</span>{% if link.badge %}<span class="rounded-full bg-indigo-600 px-2 py-0.5 text-xs font-semibold text-white tabular-nums">{{ link.badge }}</span>{% endif %}</a>
    </li>
    {% endfor %}
</ul>
