{# djust:partial #}
{% comment %}A campaign's status as a chip with a dot, coloured like the product prototype. Expects "campaign" in the context.{% endcomment %}
<span class="inline-flex max-w-full items-center gap-1.5 rounded-full px-2.5 text-start py-0.5 text-xs font-semibold {% if campaign.status == 'live' %}bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300{% elif campaign.status == 'ai_building' %}bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300{% elif campaign.status == 'needs_changes' %}bg-red-50 text-red-700 dark:bg-red-950 dark:text-red-300{% elif campaign.status == 'paused_low_balance' %}bg-sky-50 text-sky-700 dark:bg-sky-950 dark:text-sky-300{% elif campaign.status == 'ended' %}bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400{% else %}bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300{% endif %}"><span class="h-1.5 w-1.5 shrink-0 rounded-full bg-current" aria-hidden="true"></span>{{ campaign.get_status_display }}</span>
