{% load i18n %}
<aside class="card lg:sticky lg:top-6" aria-labelledby="summary-heading">
    <h2 id="summary-heading" class="section-title">{% translate "Your campaign" %}</h2>
    {% if summary %}
    <dl class="mt-3 divide-y divide-slate-100 text-sm dark:divide-slate-800">
        {% for row in summary %}
        <div class="flex items-start justify-between gap-3 py-2">
            <dt class="shrink-0 text-slate-500 dark:text-slate-400">{{ row.label }}</dt>
            <dd class="text-end font-medium" dir="auto">{% if row.value %}{{ row.value }}{% else %}<span class="text-slate-400 dark:text-slate-500">—</span>{% endif %}</dd>
        </div>
        {% endfor %}
    </dl>
    {% else %}
    <p class="section-text">{% translate "Your choices appear here as you go." %}</p>
    {% endif %}
</aside>
