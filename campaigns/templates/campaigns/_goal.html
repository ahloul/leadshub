{% comment %}A campaign's optimization goal as a short badge with a dot (the full name is on the campaign page). Expects "campaign" in the context.{% endcomment %}
<span class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-md px-2 py-0.5 text-xs font-semibold {% if campaign.goal == 'more_leads' %}bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300{% elif campaign.goal == 'better_quality' %}bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300{% else %}bg-sky-50 text-sky-700 dark:bg-sky-950 dark:text-sky-300{% endif %}"><span class="h-1.5 w-1.5 shrink-0 rounded-full bg-current" aria-hidden="true"></span>{{ campaign.goal_name }}</span>
